services:
  synape-server:
    build: .
    container_name: synape-server
    ports:
      - "3000:3000"
    volumes:
      - synape-data:/app/data
    environment:
      - PORT=3000
      - DATABASE_PATH=/app/data/synape.db
      # OAuth — set your actual secrets here or in a .env file
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-Ov23liXcWby6XVM80TfG}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-361959797138-ahsfia59q9cf6h6njln6qt26jk763jp7.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Deep-link scheme the desktop app registers (must match tauri.conf.json)
      - DEEP_LINK_SCHEME=${DEEP_LINK_SCHEME:-Synape}
      # Optional — API upstream for non-auth routes
      - UPSTREAM_API=${UPSTREAM_API:-}
    restart: unless-stopped

volumes:
  synape-data:
