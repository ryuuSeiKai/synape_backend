services:
  synape-server:
    build: .
    container_name: synape-server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://synape:synape@synape-db:5432/synape?sslmode=disable
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-Ov23liXcWby6XVM80TfG}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-361959797138-ahsfia59q9cf6h6njln6qt26jk763jp7.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - DEEP_LINK_SCHEME=${DEEP_LINK_SCHEME:-Synape}
    depends_on:
      synape-db:
        condition: service_healthy
    restart: unless-stopped

  synape-db:
    image: postgres:16-alpine
    container_name: synape-db
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=synape
      - POSTGRES_PASSWORD=synape
      - POSTGRES_DB=synape
    volumes:
      - synape-pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synape"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  synape-pgdata:
